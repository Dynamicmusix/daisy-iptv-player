name: Build Samsung Tizen Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-tizen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Tizen WGT Package
        shell: pwsh
        run: |
          pwsh ./tools/build-tizen.ps1

      - name: Verify Package Integrity
        run: |
          ls -lh dist/daisy-iptv-v1.0.0.wgt
          sha256sum dist/daisy-iptv-v1.0.0.wgt

      - name: Upload Tizen WGT Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daisy-iptv-v1.0.0.wgt
          path: dist/daisy-iptv-v1.0.0.wgt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/daisy-iptv-v1.0.0.wgt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
